name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          echo "Tag=$RAW  Version=$VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "versionCode=$VERSION_CODE"
          # 写入 app.json 的 expo.version（检查更新比较用）
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          # 写入 build.gradle 的 versionName / versionCode（安装器显示 + 覆盖安装判定）
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "---- app.json ----"; grep '"version"' app.json
          echo "---- build.gradle ----"; grep -E "versionName|versionCode" android/app/build.gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Create keystore.properties
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          cat > android/keystore.properties << EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Build release notes
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          # 上一个 tag（按版本排序），用于截取本次提交
          PREV=$(git tag --sort=-v:refname | awk -v cur="$TAG" '$0!=cur{print; exit}')
          if [ -n "$PREV" ]; then
            export RANGE="${PREV}..HEAD"
          else
            export RANGE=""
          fi
          # 优先用 commit 正文分点；没有正文时才用首行总结
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const range = process.env.RANGE || '';
          const args = range
            ? ['log', range, '--no-merges', '--pretty=format:%s%x00%b%x00']
            : ['log', '-20', '--no-merges', '--pretty=format:%s%x00%b%x00'];
          const raw = execFileSync('git', args, { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });
          const parts = raw.split('\0');
          const items = [];
          for (let i = 0; i + 1 < parts.length; i += 2) {
            const subject = String(parts[i] || '').trim();
            if (!subject && !String(parts[i + 1] || '').trim()) continue;
            const body = String(parts[i + 1] || '');
            const bullets = body
              .split(/\r?\n/)
              .map((l) => l.trim())
              .filter(Boolean)
              .map((l) => l.replace(/^[-*•]\s+/, '').replace(/^\d+[\.)]\s+/, '').trim())
              .filter((l) => l.length >= 2);
            if (bullets.length > 0) {
              for (const b of bullets) items.push(b);
            } else if (subject) {
              items.push(subject);
            }
          }
          const seen = new Set();
          const out = [];
          for (const it of items) {
            if (seen.has(it)) continue;
            seen.add(it);
            out.push(it);
            if (out.length >= 30) break;
          }
          const md = ['## 更新内容', '', ...out.map((l) => '- ' + l), ''].join('\n');
          fs.writeFileSync('release_notes.md', md);
          console.log(md);
          NODE

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          body_path: release_notes.md
          generate_release_notes: false
